# SonarQube Project Configuration for WebApp Analytics ETL Pipeline

# Project identification
sonar.projectKey=webapp-analytics-etl
sonar.projectName=WebApp Analytics ETL Pipeline
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=notebooks/dataproducts/webapp/ingestion.py
sonar.tests=test_ingestion_final.py

# Python specific settings
sonar.language=py
sonar.python.version=3.8, 3.9, 3.10, 3.11

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/test_*.py,**/__pycache__/**,**/*.pyc,venv/**,.venv/**

# Test coverage exclusions
sonar.coverage.exclusions=test_*.py

# Source encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.python.pylint.reportPath=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Code quality settings
sonar.qualitygate.wait=true
