# SonarQube Configuration for WebApp Analytics ETL Pipeline

sonar.projectKey=webapp-analytics-etl
sonar.projectName=WebApp Analytics ETL Pipeline
sonar.projectVersion=1.0.0

# Source code location (relative to this file)
sonar.sources=ingestion.py
sonar.tests=test_ingestion.py

# Python specific settings
sonar.language=py
sonar.python.version=3.8, 3.9, 3.10, 3.11

# Coverage settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**

# Test exclusions
sonar.test.exclusions=test_*.py

# Coverage exclusions
sonar.coverage.exclusions=test_*.py
